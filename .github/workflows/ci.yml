name: CI

# Issue #67: with node_modules absent in a clean checkout, `npm run typecheck` exits 127
# (`tsc: command not found`) and `npm test` fails 4 files with ERR_MODULE_NOT_FOUND: express
# (api, auth, multiWorker, ui). That meant the entire authentication and authorization surface was
# unverifiable from a fresh clone, and nothing caught it because nothing ran on a fresh clone.
# The fix is a job that installs dependencies before running anything.
#
# Path policy: narrative markdown alone does not burn the dual-Node matrix. Contract markdown
# (README / QUICKSTART / remote-client-setup / deploy README) still runs the cheap docs-contract
# job — those files are pinned by test/nodeFloor.test.ts and test/deployDocs.test.ts. Anything
# else (or any push to main) runs the full suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes an older run; cancel it rather than burn runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      code: ${{ steps.gate.outputs.code }}
      contract_docs: ${{ steps.gate.outputs.contract_docs }}
    steps:
      - uses: actions/checkout@v4

      # On push to main always run the full suite. On PRs, classify the file set.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - '**'
              - '!docs/**/*.md'
              - '!ARCHITECTURE.md'
              - '!AGENTS.md'
              - '!README.md'
              - '!QUICKSTART.md'
              - '!deploy/README.md'
            contract_docs:
              - 'README.md'
              - 'QUICKSTART.md'
              - 'docs/remote-client-setup.md'
              - 'deploy/README.md'

      - name: Set path-filter outputs
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_CONTRACT: ${{ steps.filter.outputs.contract_docs }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "contract_docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=${FILTER_CODE}" >> "$GITHUB_OUTPUT"
            echo "contract_docs=${FILTER_CONTRACT}" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Do not let one Node version masking a failure in the other go unnoticed, and do not stop
      # at the first failure: a floor-only break and an LTS-only break are different problems.
      fail-fast: false
      matrix:
        # 22.18.0 is the exact floor declared in package.json `engines`, and it is tested by exact
        # version rather than as `22.x` on purpose: `22.x` resolves to the LATEST 22, so a change that
        # broke only on the floor would pass CI while every supported user kept working. The floor is
        # the later of two measured boundaries -- flag-free `node:sqlite` (22.13) and flag-free
        # TypeScript type stripping (22.18), which production needs because it runs `node src/cli.ts`
        # with no build step. Both were measured against real Node binaries, not release notes.
        # If `engines` moves, change it here and in the same commit, or test/nodeFloor.test.ts fails.
        node-version: ['22.18.0', '24.x']
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` rather than `npm install`: it is reproducible from the lockfile and it FAILS
      # loudly if package.json and package-lock.json have drifted, where `npm install` would
      # silently rewrite the lockfile and hide the drift.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Guards the diagnostic that #67 was about: a fresh clone with no install fails with a clear
  # ERR_MODULE_NOT_FOUND rather than something confusing.
  #
  # Today this passes because `npm test` exits 1 with ERR_MODULE_NOT_FOUND (express, via
  # src/api/server.ts) when node_modules is absent. So if this job ever goes red because `npm test`
  # PASSED, the only reading is that the tests stopped needing anything from node_modules at all --
  # express is no longer imported on the path the tests take, or the API/auth surface has been
  # dropped from the glob. That is the guard going VACUOUS, not the bug coming back: it would be
  # proving nothing while still reporting green. Delete or rewrite it in that case; do NOT "fix" it
  # by inverting the check, which would turn a vacuous guard into a wrong one.
  uninstalled-checkout-fails-clearly:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Confirm the missing-dependency failure is legible
        run: |
          set +e
          out=$(npm test 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "npm test unexpectedly passed without node_modules; this guard needs revisiting" >&2
            exit 1
          fi
          if ! echo "$out" | grep -q "ERR_MODULE_NOT_FOUND"; then
            echo "npm test failed, but not with the expected ERR_MODULE_NOT_FOUND:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "OK: uninstalled checkout fails with ERR_MODULE_NOT_FOUND as expected"

  # Contract markdown only: pin Node floor and deploy guide paths without the full matrix.
  docs-contract:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.changes.outputs.code != 'true' && needs.changes.outputs.contract_docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Docs contract tests
        run: node --test --test-timeout=180000 test/nodeFloor.test.ts test/deployDocs.test.ts

  # Always reports a single status so narrative-only PRs are not stuck waiting on skipped required jobs.
  ci:
    name: ci
    needs: [changes, test, uninstalled-checkout-fails-clearly, docs-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Evaluate path-filtered results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CONTRACT: ${{ needs.changes.outputs.contract_docs }}
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          UNINSTALL: ${{ needs.uninstalled-checkout-fails-clearly.result }}
          DOCS: ${{ needs.docs-contract.result }}
        run: |
          set -e
          if [ "$CHANGES" != "success" ]; then
            echo "changes job did not succeed: $CHANGES" >&2
            exit 1
          fi

          if [ "$CODE" = "true" ]; then
            if [ "$TEST" != "success" ] || [ "$UNINSTALL" != "success" ]; then
              echo "full CI failed (test=$TEST uninstall=$UNINSTALL)" >&2
              exit 1
            fi
            echo "full CI passed"
            exit 0
          fi

          if [ "$CONTRACT" = "true" ]; then
            if [ "$DOCS" != "success" ]; then
              echo "docs-contract failed: $DOCS" >&2
              exit 1
            fi
            echo "docs-contract passed (full matrix skipped)"
            exit 0
          fi

          echo "narrative docs only — full CI and docs-contract skipped"
