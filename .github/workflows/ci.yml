name: CI

# Issue #67: with node_modules absent in a clean checkout, `npm run typecheck` exits 127
# (`tsc: command not found`) and `npm test` fails 4 files with ERR_MODULE_NOT_FOUND: express
# (api, auth, multiWorker, ui). That meant the entire authentication and authorization surface was
# unverifiable from a fresh clone, and nothing caught it because nothing ran on a fresh clone.
# The fix is a job that installs dependencies before running anything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes an older run; cancel it rather than burn runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Do not let one Node version masking a failure in the other go unnoticed, and do not stop
      # at the first failure: a floor-only break and an LTS-only break are different problems.
      fail-fast: false
      matrix:
        # 23.6.0 is the exact floor declared in package.json `engines`. Testing it explicitly is
        # the point: `node:sqlite` only became usable around that release, so an LTS-only job
        # would happily pass while the floor was broken.
        node-version: ['23.6.0', '24.x']
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` rather than `npm install`: it is reproducible from the lockfile and it FAILS
      # loudly if package.json and package-lock.json have drifted, where `npm install` would
      # silently rewrite the lockfile and hide the drift.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Guards the diagnostic that #67 was about: a fresh clone with no install fails with a clear
  # ERR_MODULE_NOT_FOUND rather than something confusing.
  #
  # If this job ever goes red because `npm test` PASSED, that means the tests no longer need
  # anything from node_modules -- express has stopped being imported on the path the tests take,
  # or the API/auth surface has been dropped. Either way the guard is no longer testing what it
  # claims to and should be deleted or rewritten, not "fixed" by inverting the check.
  uninstalled-checkout-fails-clearly:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Confirm the missing-dependency failure is legible
        run: |
          set +e
          out=$(npm test 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "npm test unexpectedly passed without node_modules; this guard needs revisiting" >&2
            exit 1
          fi
          if ! echo "$out" | grep -q "ERR_MODULE_NOT_FOUND"; then
            echo "npm test failed, but not with the expected ERR_MODULE_NOT_FOUND:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "OK: uninstalled checkout fails with ERR_MODULE_NOT_FOUND as expected"
