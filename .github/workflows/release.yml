name: Release

# Tag-only. A host or Fleet bump on main does not publish until the matching
# prefixed tag is pushed. Bare vX.Y.Z tags are not in this filter and are not
# handled here.

on:
  push:
    tags:
      - 'host-v*.*.*'
      - 'fleet-v*.*.*'
  # Rehearsal. A manual run executes everything a real release does -- tag parsing, the version and
  # release-notes checks, install, bundle build, the OIDC exchange -- and then stops short of the
  # three things that touch the outside world: `npm publish`, `gh release create`, and the Homebrew
  # formula push. It takes no input and cannot publish, on purpose: a manual trigger that could
  # publish is a manual trigger someone eventually pulls by accident. This exists because the tag
  # path had failed three times in a row and every diagnosis required burning a real tag to learn
  # anything.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Parse tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIRECT_PUBLISH: ${{ vars.NPM_DIRECT_PUBLISH }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A dispatch carries a branch, not a tag. Derive the tag a real release of this commit
            # would use so every check below runs against the same inputs a real run would see.
            tag="host-v$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
            echo "rehearsal: derived ${tag} from package.json; a dispatch carries no tag"
          fi
          if [[ ! "$tag" =~ ^(host|fleet)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "refusing tag ${tag}; expected host-vX.Y.Z[-prerelease] or fleet-vX.Y.Z[-prerelease]" >&2
            exit 1
          fi
          product="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          notes="docs/releases/${product}/${version}.md"
          if [ ! -f "$notes" ]; then
            echo "missing ${notes}" >&2
            exit 1
          fi

          if [ "$product" = "host" ]; then
            pkg=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
            [ "$pkg" = "$version" ] || { echo "package.json version ${pkg} != tag ${version}" >&2; exit 1; }
            title="Mercury host v${version}"
          elif [ "$product" = "fleet" ]; then
            pkg=$(node -e "console.log(JSON.parse(require('fs').readFileSync('fleet/package.json','utf8')).version)")
            [ "$pkg" = "$version" ] || { echo "fleet/package.json version ${pkg} != tag ${version}" >&2; exit 1; }
            title="Mercury Fleet v${version}"
          else
            # Unreachable: the tag regex above admits host and fleet only. Kept fail-closed so that a
            # future product added to the regex without adding a branch here cannot publish with an
            # unset title or skip the manifest comparison. The cli branch that used to live here was
            # removed: a cli-vX.Y.Z tag published a GitHub Release and no artifact, because the CLI
            # ships inside @aywengo/mercury and has no version of its own.
            echo "refusing tag ${tag}: product ${product} has no release branch" >&2
            exit 1
          fi

                    # Choose how to authenticate to npm BEFORE creating the release. `gh release create` needs
          # only contents:write and succeeds with no npm credential at all; the `npm publish` below
          # then fails closed, leaving a public GitHub Release advertising a version that was never
          # published -- the same half-state that made the cli-* tag worth deleting. So the step has to
          # know it can authenticate before it reaches anything irreversible.
          #
          # Two modes, in preference order:
          #
          #   1. NPM_TOKEN, a long-lived automation token, surfaced as NODE_AUTH_TOKEN on this step.
          #   2. OIDC trusted publishing: no secret at all. npm/cli (lib/utils/oidc.js) requests an ID
          #      token from the runner -- those two env vars exist if and only if the job has
          #      id-token:write, which this workflow already grants -- and exchanges it at
          #      /-/npm/v1/oidc/token/exchange/package/<name> for a short-lived publish token.
          #
          # Mode 2 is the durable one, not a convenience. npm is stripping 2FA-bypassing granular
          # tokens of direct publish (github.blog changelog, 2026-07-31). The first real tag push here
          # was rejected with `E404 PUT /@aywengo%2fmercury` by two such tokens in a row, while
          # `npm whoami` succeeded on both: the credential was valid and simply not permitted to
          # publish. Long-lived npm secrets are a sinking platform, so the token path stays supported
          # but is no longer required.
          #
          # OIDC is attempted before npm reads credentials and NEVER throws. Every failure path in
          # oidc.js is log.verbose, including "this package has no trusted-publishing configuration",
          # so a missing configuration surfaces as an opaque registry 404 rather than a reason -- which
          # is exactly how the failure above presented itself. OIDC mode therefore raises the log level
          # so the actual cause lands in the log instead of having to be inferred.
          # Resolved here rather than inside the rehearsal probe because the failure classifier below
          # needs it too. npa's escapedName, which is what the registry accepts in a path: the leading
          # "@" stays literal and only the slash is encoded.
          if [ "$product" = "host" ]; then
            pkg_name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).name)")
          else
            pkg_name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('fleet/package.json','utf8')).name)")
          fi
          pkg_esc=${pkg_name//\//%2F}
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "publish auth: NPM_TOKEN"
            # npm's accepted set is silent|error|warn|notice|http|info|verbose|silly. `normal` is not in
            # it: the real 0.1.0-rc1 run logged `npm warn invalid config loglevel="normal" set in command
            # line options` and ignored the flag, so a token failure arrived with no more detail than
            # "Unable to authenticate". notice is npm's default and is a valid member of the set.
            npm_loglevel=notice
            npm_auth_mode=token
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "publish auth: OIDC trusted publishing (no repository secret)"
            npm_loglevel=verbose
            npm_auth_mode=oidc
            # actions/setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a
            # PROJECT .npmrc because registry-url is set. With no secret that is an empty credential at
            # project scope, which outranks the user-scope token npm's OIDC exchange installs via
            # config.set(..., 'user'). Drop only the EMPTY token line and keep the registry line.
            #
            # node rather than sed -i: GNU sed takes `sed -i /pat/d f` while BSD sed reads /pat/d as the
            # backup suffix and dies with "invalid command code". The job runs on ubuntu-latest but its
            # tests run on macOS, so sed would make this red locally and green in CI. node is already a
            # hard dependency of this step.
            if [ -f .npmrc ]; then
              node -e 'const fs=require("fs");const p=".npmrc";fs.writeFileSync(p,fs.readFileSync(p,"utf8").split("\n").filter((l)=>!/:_authToken=\s*$/.test(l)).join("\n"))'
            fi
            # Print the claims npm will match this run against. npm reports a trusted-publishing
            # mismatch exactly as it reports a missing configuration -- an opaque registry 404 with no
            # reason -- so the decoded token is the only way to see a cause without pushing a real tag
            # and finding out.
            #
            # A GitHub trusted publisher is keyed on owner + repository + workflow filename, so print
            # the claim that carries each. `workflow` is the workflow's display NAME (`name:` in this
            # file), which npm does NOT match; the filename lives in `job_workflow_ref`, shaped like
            # `aywengo/mercury/.github/workflows/release.yml@refs/<ref>`, where the ref is the tag on a
            # real release and a branch on a rehearsal. Printing only a
            # selected subset is what produced the claim here that no claim carried the filename at
            # all -- the key was missing from the list, which is not the same as it not existing.
            # The audience has to be the one npm itself asks for, or this prints claims from a token
            # that takes part in no decision. npm/cli's lib/utils/oidc.js builds its audience as
            # `npm:${new URL(registry).hostname}` -- `npm:registry.npmjs.org` -- and lib/commands/
            # publish.js calls that same oidc() helper, so it is the only token a publish presents.
            # GitHub's identity claims are identical across audiences, so the list below stayed
            # correct either way; the value of `aud` printed next to them did not.
            id_json=$(curl -sS --max-time 30 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" || echo "")
            id_token=$(node -e 'try{console.log(JSON.parse(process.argv[1]).value||"")}catch{console.log("")}' "$id_json")
            if [ -n "$id_token" ]; then
              # Guarded, because this block exists to explain a failure. An undecodable token used to
              # throw out of JSON.parse and print a Node stack trace in place of every claim, which is the
              # worst possible outcome for the one diagnostic that reads the identity npm will match
              # against: the operator sees a stack about node -e instead of the claims.
              node -e 'let c=null;
                try { c=JSON.parse(Buffer.from(String(process.argv[1].split(".")[1]||""),"base64url").toString()); }
                catch {
                  console.log("  oidc claims: the id_token is not a decodable JWT; nothing to report");
                  process.exit(0);
                }
                // A parse that succeeds is not the same as a claim set. The payload `null` parses fine and
                // then throws TypeError on the first property read, which is the exact stack trace this
                // guard exists to prevent -- so the shape is checked, not just the syntax.
                if (c===null || typeof c!=="object" || Array.isArray(c)) {
                  console.log("  oidc claims: the id_token payload is not a JSON object; nothing to report");
                  process.exit(0);
                }
                for (const k of ["iss","enterprise","sub","aud","ref","ref_type","repository",
                                 "repository_owner","workflow","job_workflow_ref","event_name"])
                  console.log(`  oidc ${k} = ${c[k]}`)' "$id_token"
              echo "  npm matches repository_owner + repository + the filename inside job_workflow_ref;"
              echo "  'workflow' above is the display name and is not matched"
              # Flag the one claim whose SHAPE has been shown to matter here, rather than leaving it in a
              # list of fifteen for a reader to notice. GitHub mints `sub` two ways: name-only
              # (`repo:aywengo/mercury:ref:...`) and, for repositories under the enforced default, with
              # numeric IDs (`repo:aywengo@800531/mercury@1349412409:ref:...`). The rc1 provenance
              # certificate in Rekor proves this repository presented the name-only form on the one run
              # that got as far as signing; every run since presents the ID form, and npm refuses the
              # exchange on all of them. A claim that changes underneath a working configuration and is
              # printed as one line among fifteen is not a diagnostic.
              # base64url, not base64: the claim printer above uses base64url, and a JWT payload is
              # base64url-encoded. Decoding `-`/`_` as base64 yields garbage, JSON.parse throws, and the
              # diagnostic prints a Node stack trace into a failed release log instead of a sentence.
              # The regex is anchored to the repository segment rather than the whole claim: a branch
              # named feature@123 would otherwise warn about repository IDs that are not present.
              if printf '%s' "$id_token" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const p=JSON.parse(Buffer.from(String(s.split(".")[1]||""),"base64url").toString());process.exit(/^repo:[^:]*@\d+/.test(p.sub||"")?0:1)}catch{process.exit(1)}})'; then
                echo "  !! sub carries numeric repository IDs, so GitHub is issuing the immutable" >&2
                echo "     subject format. This repository was created after 2026-07-15, when GitHub" >&2
                echo "     made that format automatic, and npm matches trusted publishers against the" >&2
                echo "     name-only shape. Measured in #375: a package that does not exist is refused" >&2
                echo "     with these same bytes, so npm rejects the token before consulting any" >&2
                echo "     package -- no setting on npmjs.com can account for that. See issue #376." >&2
                echo "     Check it with: gh api repos/aywengo/mercury/actions/oidc/customization/sub" >&2
                echo "       --jq .sub_claim_prefix      # want: repo:aywengo/mercury" >&2
              fi
              # `iss` is printed because npm's registry trusts exactly one issuer URL, and a GitHub
              # Enterprise with include_enterprise_slug makes GitHub mint
              # `https://token.actions.githubusercontent.com/<slug>` instead. npm/cli#9203 reports that
              # this is refused with "OIDC token exchange error - unauthorized" while every other claim
              # matches; closed as a duplicate, not fixed. It is the only known cause that produces this
              # repository's exact symptom, and it is invisible unless the claim is printed -- which is
              # how a previous version of this probe managed to describe the token from a subset of it.
              # Read `iss` above: anything other than exactly
              # https://token.actions.githubusercontent.com means npm will refuse the exchange no matter
              # how well the other claims match, and no setting on npmjs.com will change that.
            else
              echo "  the runner refused to mint an id token; npm cannot authenticate via OIDC" >&2
            fi

            # The OIDC exchange is diagnosed by npm itself, further down, by running
            # `npm publish --dry-run --provenance --loglevel verbose` and printing derived verdicts.
            # That capture is in the host rehearsal branch only. A fleet rehearsal runs a plain
            # `npm publish --dry-run` and emits no OIDC verdicts, which is correct rather than an
            # oversight: @aywengo/mercury-fleet has never been published, so an exchange for it has
            # nothing to authenticate against and a verdict would be noise. The fleet gate earlier in
            # this job says so directly.
            #
            # A curl reproduction of this request used to stand here and must not come back. It returned
            # `unauthorized` for every input it was given -- this package, an unrelated package, a
            # package that does not exist, and a bearer of `not.a.real.jwt` -- so it could not
            # distinguish a valid GitHub OIDC token from a fake string, and every answer it produced
            # described its own malformed request rather than the registry's trust decision. npm sets
            # //registry.npmjs.org/:_authToken to the id_token and lets npm-registry-fetch build the
            # call; the probe sent a bearer header.
            #
            # Measured truth, from npm's own code path: the exchange returns HTTP 201 and npm logs
            # "Successfully retrieved and set token". Trusted publishing works for this repository.
            # See docs/releasing.md.
          else
            echo "refusing ${tag}: no NPM_TOKEN and no OIDC id-token available; npm publish would fail after the release is created" >&2
            exit 1
          fi
          # A Fleet release has exactly one installable artifact: the npm package. It attaches no bundle
          # and has no Homebrew formula, so when npm cannot be reached this job still creates a GitHub
          # Release, and that release contains nothing a user can install.
          #
          # One variant of that outcome is certain before anything else runs. Trusted publishing is
          # configured on the package page, so the page must exist first; creating the page needs a first
          # publish; and a first publish cannot use trusted publishing, because there is no page to trust
          # yet. So a fleet tag pushed without a credential, for a package that has never been published,
          # cannot succeed whatever else is true. Say that here rather than after making an empty release.
          #
          # The gate asks the registry instead of hard-coding the package name, so it removes itself the
          # day @aywengo/mercury-fleet exists. A token still passes, because a token is exactly how that
          # first publish gets made.
          if [ "$product" = "fleet" ] && [ "${npm_auth_mode:-}" != "token" ]; then
            if [ "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/${pkg_esc}" || echo 000)" = "404" ]; then
              echo "refusing ${tag}: ${pkg_name} does not exist on the registry (HTTP 404)." >&2
              echo "  Fleet ships only through npm, so this tag would create a GitHub Release with no" >&2
              echo "  asset and then fail -- nothing installable." >&2
              echo "  Trusted publishing is configured on the package page, which cannot be configured" >&2
              echo "  before the package exists, so the first publish needs a credential, run" >&2
              echo "  INSIDE the Fleet package:" >&2
              echo "    cd fleet && cp ../LICENSE LICENSE && npm publish --access public --tag rc" >&2
              echo "  At the repository root that command publishes @aywengo/mercury, not Fleet." >&2
              echo "  After that, a fleet tag needs no secret at all." >&2
              exit 1
            fi
          fi
          # Install BEFORE anything that compiles. `npm publish` runs `prepare`, which runs tsc, and
          # setup-node does not install dependencies. Without this line the publish fails with
          # "tsc: not found" -- and did so AFTER the `gh release create` further down, which needs only
          # contents:write and therefore succeeded, leaving a public GitHub Release for a version that
          # was never published. That is the same half-release state #265 was written for, reached by a
          # different route. No tag had ever been pushed, so nothing had ever exercised this path.
          npm ci --no-audit --no-fund

          # npm's default dist-tag is "latest" for ANY version, prerelease included -- `npm config get
          # tag` prints "latest". Publishing 0.1.0-rc1 without --tag would therefore make
          # `npm install @aywengo/mercury` resolve to the release candidate for everyone. So a
          # prerelease is published under its own identifier: 0.1.0-rc1 -> rc, 1.2.0-beta.3 -> beta.
          # A stable version still goes to latest. This is the convention npm itself documents and
          # what packages like react do (rc -> 19.0.0-rc.1 while latest stays on a stable release).
          case "$version" in
            *-*)
              pre="${version#*-}"        # 0.1.0-rc1      -> rc1
              pre="${pre%%.*}"           # rc.1           -> rc
              dist_tag="${pre%%[0-9]*}"  # rc1            -> rc
              [ -n "$dist_tag" ] || dist_tag=next   # e.g. 1.0.0-1 has no alphabetic identifier
              ;;
            *) dist_tag=latest ;;
          esac
          echo "publishing ${product} ${version} under dist-tag ${dist_tag}"

          if [ "$product" = "host" ]; then
            # The Homebrew bundle is built before the release exists so a bundle failure cannot leave a
            # release advertising an artifact that was never produced.
            bundle_json=$(node scripts/build-bundle.mjs --out "$RUNNER_TEMP/bundle")
            bundle=$(node -e "console.log(JSON.parse(process.argv[1]).tarball)" "$bundle_json")
            bundle_sha=$(node -e "console.log(JSON.parse(process.argv[1]).sha256)" "$bundle_json")
            # The bundler reports its own sha256; nothing else has ever compared that claim to the
            # bytes it wrote. That sha is what Homebrew verifies on install, so a bundler that hashes
            # anything other than the final tarball ships a formula whose checksum never resolves.
            # The formula commit is pushed with GITHUB_TOKEN, so GitHub creates no workflow run for
            # it (issue #427) and main's tip carries no CI -- this job is the only place that can
            # notice, and it still has the bytes in hand.
            if [ ! -f "$bundle" ]; then
              echo "bundler reported ${bundle} but no such file exists" >&2
              exit 1
            fi
            # node rather than sha256sum/shasum: the step already requires node, and the two coreutils
            # spellings differ across the platforms this step's tests run on.
            actual_sha=$(node -e 'const fs=require("fs"),c=require("crypto");process.stdout.write(c.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$bundle")
            if [ "$actual_sha" != "$bundle_sha" ]; then
              echo "bundle checksum mismatch: bundler claims ${bundle_sha}, ${bundle} hashes to ${actual_sha}" >&2
              exit 1
            fi
            echo "bundle=${bundle}"
            echo "bundle sha256=${bundle_sha}  -> paste into Formula/mercury-ai.rb in aywengo/homebrew-tap"
          fi

          # Publish first, create the release second. Reversed, every failure between the two leaves a
          # public release pointing at an uninstallable version; in this order the worst case is a
          # published package with no release page, an inconvenience rather than a trap.
          # Stage rather than publish, by default. `npm stage publish` submits the package and defers
          # proof-of-presence to a maintainer approving it on npmjs.com; npm's guidance is that CI
          # configurations should stage, and direct publish is being taken away from 2FA-bypassing
          # tokens (github.blog changelog, 2026-07-31) -- which is exactly how the first two real tag
          # pushes here failed. Staging is the path that works with the credential that survives that
          # change, and it is what lets the job reach the Homebrew artifacts at all: the bundle and the
          # formula need nothing from npm, but they are built after this step and an abort here means
          # no Homebrew install either.
          #
          # The command is a drop-in: npm/cli's lib/commands/stage/publish.js is `class StagePublish
          # extends Publish` with `static stage = true` and `static params = Publish.params`, so
          # --access, --tag, --provenance and --loglevel all carry over unchanged.
          #
          # Staging needs npm >= 11.15. Verified against the published tarballs rather than inferred from
          # merge dates: lib/commands/stage/index.js is absent from npm@11.14.0 and present in
          # npm@11.15.0. The runner's npm comes from the node version, so detect instead of assuming.
          # Set the repository variable NPM_DIRECT_PUBLISH to "true" to publish straight to the
          # registry, which is what an OIDC configuration with direct publishing enabled will want.
          if [ "${NPM_DIRECT_PUBLISH:-}" = "true" ]; then
            npm_verb="publish"
          elif npm stage --help >/dev/null 2>&1; then
            npm_verb="stage publish"
          else
            npm_verb="publish"
          fi
          echo "npm submission mode: ${npm_verb}"

          # Submit to npm, but do not let npm decide whether Mercury is installable at all.
          #
          # The invariant this job protects is NOT "never create a release unless npm succeeded". It is
          # "the release body must accurately describe what is installable". #265 and #271 enforced the
          # first by refusing to create a release at all, which was right while the only way for the body
          # to be accurate was for npm to have worked. It stopped being right the moment npm became
          # unreachable for reasons this repository cannot fix: the bundle, the GitHub Release and the
          # formula are a complete installable path that needs nothing from npm, and aborting here let a
          # registry policy change take the Homebrew channel down with it (issue #277).
          #
          # So npm failure is now recorded, disclosed on the release page, and reported as a failed job at
          # the very END. The job still goes red -- a silently green release with no npm package is exactly
          # the half-release this repo has repeatedly refused -- but red now means "npm needs attention",
          # not "nobody can install Mercury".
          npm_ok=1
          npm_log="${RUNNER_TEMP}/npm-submit.log"
          if [ "${DRY_RUN:-}" = "true" ]; then
            # `npm publish --dry-run` builds the tarball and prints what would go up, and performs no
            # registry write. --provenance IS passed: it is what makes npm take the OIDC path that
            # decides whether provenance would be attached, so omitting it would rehearse a different
            # command than the one the release runs.
            echo "DRY RUN: not submitting to npm; packing only"
            # `--dry-run` does authenticate. npm's own publish calls `await oidc(...)` before it looks at
            # dryRun at all (lib/commands/publish.js), so every rehearsal to date has already performed the
            # real token exchange -- at the default log level, which hides every failure path in it because
            # they are all log.verbose. Asking npm to run its OWN exchange at silly level is the only
            # reading that comes from npm rather than from our curl approximation of it, and the two have
            # disagreed: our probe sends a bearer header, npm sets _authToken and lets npm-registry-fetch
            # build the request. Capture it and print the oidc lines; that is npm naming its own reason.
            if [ "$product" = "host" ]; then
              # verbose, not silly: every message in npm's lib/utils/oidc.js is log.verbose, and silly
              # additionally dumps the exchange RESPONSE BODY, which is a live publish credential that
              # anyone with read access to the run log could use. A test pins this.
              npm publish --dry-run --access public --tag "$dist_tag" --provenance --loglevel verbose \
                >"${RUNNER_TEMP}/npm-oidc.log" 2>&1 || npm_ok=0
              echo "--- npm's own OIDC exchange (loglevel=verbose) ---"
              # Print derived verdicts, never log lines. The exchange response IS a live publish
              # credential, and npm at verbose level emits lines that contain it. Echoing npm's output
              # and filtering it is a denylist over a secret, which has to be right every time; these
              # print fixed strings computed by grep, so no credential can reach the log by
              # construction. A test pins this.
              if grep -qE 'npm http fetch POST 2[0-9][0-9] [^ ]*oidc/token/exchange' "${RUNNER_TEMP}/npm-oidc.log"; then
                echo "  => npm's own exchange returned 2xx: a publish credential was issued."
              else
                echo "  => npm's own exchange did not return 2xx."
              fi
              if grep -q 'npm verbose oidc Successfully retrieved and set token' "${RUNNER_TEMP}/npm-oidc.log"; then
                echo "  => npm logged: Successfully retrieved and set token."
              fi
              if grep -qE 'ENEEDAUTH|Unable to authenticate' "${RUNNER_TEMP}/npm-oidc.log"; then
                echo "  => npm reported it had no usable credential at publish time."
              fi
              if ! grep -q 'oidc' "${RUNNER_TEMP}/npm-oidc.log"; then
                echo "  => npm logged nothing about oidc; it did not attempt the exchange."
              fi
              # The captured log can contain the issued credential. Verdicts above are derived strings;
              # nothing downstream needs the raw file, so do not leave it readable to later steps or to
              # anyone who opens the runner's temp directory.
              rm -f "${RUNNER_TEMP}/npm-oidc.log"
            elif [ "$product" = "fleet" ]; then
              cp LICENSE fleet/LICENSE
              (cd fleet && npm publish --dry-run --access public --tag "$dist_tag") || npm_ok=0
            fi
          elif [ "$product" = "host" ]; then
            npm $npm_verb --access public --provenance --tag "$dist_tag" --loglevel "$npm_loglevel" 2>&1 | tee "$npm_log" || npm_ok=0
          elif [ "$product" = "fleet" ]; then
            cp LICENSE fleet/LICENSE
            (cd fleet && npm $npm_verb --access public --provenance --tag "$dist_tag" --loglevel "$npm_loglevel" 2>&1) | tee "$npm_log" || npm_ok=0
          fi
          if [ "${DRY_RUN:-}" = "true" ]; then
            # Not "submission succeeded": nothing was submitted, and a rehearsal log that reads like
            # a publish is the overstatement this repo treats as a defect wherever it appears.
            echo "DRY RUN: rehearsal complete; nothing was submitted to npm"
          elif [ "$npm_ok" = "1" ]; then
            echo "npm submission succeeded (${npm_verb})"
          else
            echo "npm submission FAILED (${npm_verb}); continuing so the Homebrew artifacts are still produced" >&2
            # Name the cause when the log identifies one. Every failure path in npm's OIDC exchange is
            # log.verbose, so a rejected trusted-publisher configuration arrives as a bare registry 404
            # -- which is indistinguishable, in the log, from a package that does not exist. Three real
            # releases here failed on credentials before this existed, and each one had to be read out
            # of the raw log by hand.
            if grep -qE 'EPUBLISHCONFLICT|cannot publish over|previously published' "$npm_log"; then
              echo "  cause: ${product} ${version} is already on the registry. A version number cannot" >&2
              echo "         be reused; delete the tag and cut the next one." >&2
            elif [ "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
                     "https://registry.npmjs.org/${pkg_esc}" || echo 000)" = "404" ]; then
              # The comment above says a rejected publisher and a nonexistent package look identical in
              # npm's log. They do -- but not to the registry, whose package metadata is public. One
              # request settles which this is, and the Fleet product makes the difference concrete:
              # @aywengo/mercury-fleet has never been published, so without this a fleet tag sends the
              # operator to a Trusted Publisher settings page that does not exist, for a package that
              # does not exist, blaming a credential that was never the problem.
              echo "  cause: ${pkg_name} does not exist on the registry. It has never been published," >&2
              echo "         and trusted publishing is configured on the package page, so it cannot be" >&2
              echo "         set up before the package exists. Publish it once with a token" >&2
              echo "         (npm publish --access public), then add the trusted publisher." >&2
            elif [ "${npm_auth_mode:-}" = "oidc" ] && grep -qE 'E404|404 Not Found|E401|401 Unauthorized|ENEEDAUTH|Unable to authenticate' "$npm_log"; then
              echo "  cause: the registry refused the OIDC credential. These configurations produce it," >&2
              echo "         and they look identical in the log:" >&2
              # Gate on the variable, not on the verb: `npm_verb` is also `publish` when the runner's
              # npm is too old to stage, and in that case nothing about NPM_DIRECT_PUBLISH is true.
              if [ "${NPM_DIRECT_PUBLISH:-}" = "true" ]; then
                echo "           1. direct publishing is not enabled for this trusted publisher. npm" >&2
                echo "              always allows 'npm stage publish'; direct 'npm publish' is opt-in," >&2
                echo "              and this run asked for direct because NPM_DIRECT_PUBLISH is set." >&2
                echo "              Either enable it on the package's Trusted Publisher settings, or" >&2
                echo "              unset the variable to stage instead." >&2
              else
                echo "           1. this run did not ask for direct publishing (verb: ${npm_verb}), so" >&2
                echo "              that setting is not the cause; the publisher itself was refused." >&2
              fi
              echo "           - the publisher does not match this run. It must be owner aywengo," >&2
              echo "             repository mercury, workflow filename release.yml. The claims printed" >&2
              echo "             above carry all three; compare them against the settings page." >&2
            elif [ "${npm_auth_mode:-}" = "token" ] && grep -qE 'E401|ENEEDAUTH|Unable to authenticate' "$npm_log"; then
              echo "  cause: the npm credential was rejected. NPM_TOKEN is set but not permitted to" >&2
              echo "         publish, or has expired. This is distinct from having no credential, which" >&2
              echo "         the job refuses earlier, before creating any release." >&2
            fi
          fi

          # The release notes are committed before the run and cannot know how the submission went, so the
          # body is completed here. Every npm state gets its own wording; a body that stayed silent would
          # advertise an `npm install` that does not resolve, which is the overstatement class of the
          # deleted cli-* tag.
          # The body must not name an install path it has not checked. Whether the formula is present
          # is a fact about the repository at the moment the body is written, and the body is written
          # before the formula step below runs, so it cannot be reasoned about from here: it has to be
          # asked. One unauthenticated request against a public repository answers it, and the wording
          # below branches on the answer rather than on an assumption about release history.
          # The repository IS the tap: the formula step below commits Formula/mercury-ai.rb to this
          # repository and pushes it here, and the workflow comment says so in as many words ("the
          # formula lives here rather than in a separate tap repo"). Probing aywengo/homebrew-tap --
          # which holds an unrelated product's formulae -- reported 404 for a channel that works, and
          # would have suppressed a true install path from every future release body.
          formula_live=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/Formula/mercury-ai.rb" \
            || echo 000)
          if [ "$npm_ok" = "0" ]; then
            {
              echo ""
              echo "## npm package not available for this release"
              echo ""
              echo "The \`npm ${npm_verb}\` step failed, so this version is **not** on the npm registry."
              echo "Do not follow any \`npm install\` instruction below for this version."
              echo ""
              # Which alternatives exist depends on the product, and getting this wrong is the exact
              # overstatement this block exists to prevent: Fleet attaches no asset and has no formula,
              # so the host wording would send Fleet readers to a \`brew install\` that installs a
              # different product and to a bundle that was never uploaded.
              echo "Install this release without npm:"
              echo ""
              if [ "$product" = "host" ]; then
                if [ "$formula_live" = "200" ]; then
                  echo "- Homebrew: \`brew install aywengo/mercury/mercury-ai\`"
                else
                  # Only a 404 licenses the definitive sentence. A 000 from curl, a 403 or a 5xx from
                  # rate limit says nothing about whether the formula is there, and asserting a 404 that
                  # was never observed is the exact error this block exists to prevent.
                  if [ "$formula_live" = "404" ]; then
                    echo "- Homebrew: **not confirmed.** \`Formula/mercury-ai.rb\` returned 404 on"
                    echo "  \`${GITHUB_REPOSITORY}\`, so \`brew install aywengo/mercury/mercury-ai\`"
                    echo "  is expected to fail. Verify before offering it."
                  else
                    echo "- Homebrew: **unconfirmed.** The probe for \`Formula/mercury-ai.rb\` returned"
                    echo "  HTTP \`${formula_live}\`, which says nothing about whether the formula is"
                    echo "  installable. Verify before offering \`brew install\`."
                  fi
                fi
                echo "- The asset attached to this release: download and unpack the bundle."
              else
                echo "**None. Fleet ships only through npm**, and this release attaches no asset and"
                echo "has no Homebrew formula, so this version is unavailable by every channel."
              fi
              echo ""
              echo "The job that produced this release is marked failed so the npm gap stays visible."
            } >> "$notes"
          elif [ "$npm_verb" = "stage publish" ]; then
            # npm prints "(staged with id <uuid>)" and approval is `npm stage approve <uuid>`, which
            # needs a 2FA code and so can never be done by this job. Naming the id turns "go find it in
            # the UI" into one command, and makes it obvious which staged version this run created when
            # several are waiting. The shape is npm's own UUID_REGEX from lib/utils/validate-uuid.js, so
            # what we extract is exactly what `npm stage approve` will accept -- a looser class would
            # happily capture a 36-char hex digest and print a command that errors out. -i mirrors the
            # /i on npm's own regex: the registry generates the id, so its case is not ours to assume.
            stage_id=$(grep -oiEm1 'staged with id [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$npm_log" | awk '{print $NF}' || true)
            {
              echo ""
              echo "## npm package awaiting maintainer approval"
              echo ""
              echo "This run **staged** the package on the npm registry. Staged publishing defers"
              echo "proof-of-presence to a maintainer, so \`npm install\` will not resolve this version"
              echo "until it is approved."
              if [ -n "$stage_id" ]; then
                echo ""
                echo "\`\`\`bash"
                echo "npm stage approve $stage_id     # needs a 2FA code; run it locally"
                echo "\`\`\`"
                echo ""
                echo "Or on npmjs.com under **Published packages -> Staged packages**."
              else
                echo "Approve it on npmjs.com under **Published packages -> Staged packages**."
              fi
              echo ""
              if [ "$product" = "host" ] && [ "$formula_live" = "200" ]; then
                echo "The assets attached to this release and the Homebrew formula are already live and"
                echo "need no npm approval."
              elif [ "$product" = "host" ]; then
                echo "The asset attached to this release is live and needs no npm approval. The Homebrew"
                echo "formula could not be confirmed (HTTP ${formula_live}); check it before offering"
                echo "\`brew install\` to users."
              else
                echo "Nothing else is attached to this release and there is no Homebrew formula for"
                echo "Fleet, so approval on npmjs.com is the only way this version becomes installable."
              fi
            } >> "$notes"
          fi

          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "DRY RUN: not creating the GitHub Release for ${tag}"
          elif [ "$product" = "host" ]; then
            gh release create "$tag" --title "$title" --notes-file "$notes" "$bundle"
          else
            gh release create "$tag" --title "$title" --notes-file "$notes"
          fi

          # Publish the Homebrew formula LAST, and only once the asset it points at exists. A formula
          # committed before the release would 404 for anyone who ran brew install in the window, and a
          # formula pointing at an asset that was never uploaded fails checksum resolution with nothing
          # to correlate it to. main is not branch-protected, so the contents:write token this job
          # already has is sufficient -- no cross-repository credential is needed because the formula
          # lives here rather than in a separate tap repo.
          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "DRY RUN: not touching Formula/mercury-ai.rb (bundle sha256=${bundle_sha:-n/a})"
          elif [ "$product" = "host" ]; then
            node scripts/update-formula.mjs --version "$version" --sha256 "$bundle_sha"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula/mercury-ai.rb
            if git diff --cached --quiet; then
              echo "Formula/mercury-ai.rb already at ${version}"
            else
              git commit -m "release: Homebrew formula ${version}"
              git push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
            fi
          fi

          # Fail LAST. Everything a user can install has been produced by now: the release, its bundle,
          # the formula. Failing here rather than at the npm call is what keeps the Homebrew channel alive
          # through an npm outage while still refusing to pretend the npm channel worked. Red means "npm
          # needs attention", not "Mercury cannot be installed".
          if [ "$npm_ok" = "0" ]; then
            echo "::warning::npm ${npm_verb} failed for ${tag}; the GitHub Release and Homebrew formula were still produced"
            echo "npm submission failed for ${tag}." >&2
            echo "Homebrew and the release asset are live; see the release body for what is and is not installable." >&2
            exit 1
          fi
