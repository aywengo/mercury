# Optional drop-in: allow the worker to drive the container sandbox.
#
# Install into /etc/systemd/system/mercury-worker.service.d/ and run
#   sudo systemctl daemon-reload && sudo systemctl restart mercury-worker
#
# WHY THIS IS A SEPARATE FILE AND NOT IN THE MAIN UNIT
#
# mercury-worker.service sets ProtectSystem=strict, which mounts the filesystem read-only. The
# container sandbox needs to write to /var/run/docker.sock, so the two are incompatible: with the
# hardened baseline, a run that requests isolation fails closed instead of running unsandboxed.
# That is the right default failure direction, so the baseline stays hardened and only deployments
# that actually sandbox opt in here (issue #73 L10).
#
# Before installing this, confirm the trade is one you want: it widens what the worker process can
# reach, and anything the worker can reach, a compromised run can influence through it.

[Service]
# The docker socket lives under /run, which PrivateTmp and the read-only root otherwise hide or
# protect. Listing it in ReadWritePaths re-permits exactly that path rather than the whole tree.
ReadWritePaths=/opt/mercury /var/lib/mercury /var/run/docker.sock
